plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// The jar carries the Minecraft version it was built against. Every line shares a mod version, and
// six files all called guppy-1.0.0.jar would be indistinguishable in a mods folder or on a releases
// page. The mod's own version (in neoforge.mods.toml) stays a plain ${mod_version}.
version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = mod_id
}

repositories {
    // The Mixin annotation processor, which writes the refmap (see legacyForge.mixin below).
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

// Minecraft 1.20.1 ships Java 17 to end users.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Mixins on 1.20.1 need a refmap, because the shipped jar runs against obfuscated (SRG) names:
    // the plugin runs the Mixin annotation processor to write one, and wires the dev runs.
    mixin {
        add sourceSets.main, 'guppy.refmap.json'
        config 'guppy.mixins.json'
    }
    version = project.forge_version

    if (project.parchment_minecraft_version?.trim() && project.parchment_mappings_version?.trim()) {
        parchment {
            minecraftVersion = project.parchment_minecraft_version
            mappingsVersion = project.parchment_mappings_version
        }
    }

    runs {
        client {
            client()
            // Join the dev server straight from the launcher:  ./gradlew runClient -PguppyJoin
            if (project.hasProperty('guppyJoin')) {
                programArguments.addAll '--quickPlayMultiplayer', "127.0.0.1:${project.dev_server_port}".toString()
            }
        }

        server {
            server()
            programArgument '--nogui'
            // ./gradlew runServer -Pselftest -- runs SelfTest once the server has started, logs a
            // pass/fail block and stops the server. A -D on the gradlew line would set it on
            // Gradle's JVM instead.
            if (project.hasProperty('selftest')) {
                systemProperty 'guppy.selftest', 'true'
            }
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// ---------------------------------------------------------------------------
// Build stamp, in the format shared across Sable's mods (see BuildInfo). A version number answers
// "which release"; the stamp answers "which bytes", and the startup log line says what actually RAN.
// Resolved at configure time and tolerant of git being absent: an unknown stamp never fails a build.
static String gitOut(File dir, String... args) {
    try {
        var proc = new ProcessBuilder(args).directory(dir).redirectErrorStream(true).start()
        var out = proc.inputStream.text.trim()
        return proc.waitFor() == 0 && !out.isEmpty() ? out : null
    } catch (Exception ignored) {
        return null
    }
}
var buildCommit = gitOut(projectDir, "git", "rev-parse", "--short=8", "HEAD") ?: "unknown"
var buildBranch = gitOut(projectDir, "git", "rev-parse", "--abbrev-ref", "HEAD") ?: "unknown"
var buildDirty  = gitOut(projectDir, "git", "status", "--porcelain")
if (buildDirty) buildCommit += "-dirty"   // built from uncommitted changes; say so
// The COMMIT's time (%ct, epoch), not the wall clock: a wall-clock stamp changes on every Gradle
// invocation and costs every no-op build its up-to-date checks.
var commitEpoch = gitOut(projectDir, "git", "show", "-s", "--format=%ct", "HEAD")
var buildTime = commitEpoch
        ? new Date(commitEpoch.toLong() * 1000L).format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone("UTC"))
        : "unknown"
logger.lifecycle("Build stamp: ${buildCommit} on ${buildBranch} at ${buildTime}")

// Expand mod metadata into the generated neoforge.mods.toml, and the build stamp into
// /guppy/build.properties (namespaced: a bare /build.properties would collide with other mods').
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_homepage           : mod_homepage,
            build_commit           : buildCommit,
            build_branch           : buildBranch,
            build_time             : buildTime,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

// The same stamp on the manifest, for reading a jar from a shell without loading it.
tasks.named('jar', Jar) {
    manifest {
        attributes([
                // Production Forge 1.20.1 finds a mod's mixin configs through this attribute; the
                // mixin DSL above only wires the dev runs.
                "MixinConfigs"          : "guppy.mixins.json",
                "Implementation-Title"  : mod_name,
                "Implementation-Version": mod_version,
                "Build-Commit"          : buildCommit,
                "Build-Branch"          : buildBranch,
                "Build-Time"            : buildTime,
        ])
    }
}

dependencies {
    // Writes the refmap at compile time. Without it the refmap is silently empty and every
    // vanilla-targeted mixin fails in production.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
