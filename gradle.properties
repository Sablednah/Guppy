# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled for now; some ModDevGradle run tasks interact poorly with it.
org.gradle.configuration-cache=false

# Parchment provides human-readable parameter names/javadocs. Optional.
# Leave blank to disable if no Parchment mappings are published for this MC version yet.
parchment_minecraft_version=
parchment_mappings_version=

# Environment Properties
# Latest versions: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact.
minecraft_version=26.3
# Permissive within the Minecraft line, closed at the next one: a player on any 1.21.11 patch
# should be able to run this jar, and nobody on another line should load it by mistake.
minecraft_version_range=[26.3,26.4)
neo_version=26.3.0.58-beta
# Any NeoForge for THIS line. Bounded above, so the jar is refused on a line it cannot run on
# rather than loading and failing confusingly.
neo_version_range=[26.3.0.58-beta,26.4)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[1,)

## Mod Properties
mod_id=guppy
mod_name=Guppy
mod_license=MIT
mod_version=1.0.0
mod_homepage=https://github.com/Sablednah/Guppy
mod_group_id=com.sablednah.guppy
mod_authors=Sablednah
mod_description=Notices when something speeds up time - a Time in a Bottle, a Watch of Flowing Time, a Temporal Pouch, a Torcherino or anything built the same way - and tells the player they have the patience of a guppy. The useful bit: the server log records who, what, where and when, so a lag spike can be checked against it.

## Dev server
# Clear of every sibling's dev server (ChatFilter 25580, Standards, CityWorld).
dev_server_port=25590
