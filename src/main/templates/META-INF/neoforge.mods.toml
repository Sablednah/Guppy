# Guppy — neoforge.mods.toml (values are expanded from gradle.properties at build time).
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/Guppy/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
displayURL="${mod_homepage}"
# Declared three ways, as ChatFilter does; a loader ignores the keys it doesn't know:
#   iconFile   - the small square beside the name in the mod list (26.2+): the fish plaque
#   bannerFile - the wide image in the info panel (26.2+): the wordmark
#   logoFile   - what older loaders show in the info panel
# Both are antialiased artwork on transparent backgrounds, so they are smoothed, not snapped.
iconFile="guppy-icon.png"
bannerFile="guppy-banner.png"
logoFile="guppy-banner.png"
logoBlur=true
iconBlur=true

# Small mixins mark vanilla's own block-entity and random-tick passes, so a tick from anywhere else
# can be told apart. See watch/TickWatch before porting a line.
[[mixins]]
config="guppy.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
