# Guppy — mods.toml (values are expanded from gradle.properties at build time).
# 1.20.1 Forge reads META-INF/mods.toml, and its dependency blocks take mandatory=true/false.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Sablednah/Guppy/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
displayURL="${mod_homepage}"
# Declared three ways, as ChatFilter does; a loader ignores the keys it doesn't know:
#   iconFile   - the small square beside the name in the mod list (26.2+): the fish plaque
#   bannerFile - the wide image in the info panel (26.2+): the wordmark
#   logoFile   - what older loaders show in the info panel
# Both are antialiased artwork on transparent backgrounds, so they are smoothed, not snapped.
iconFile="guppy-icon.png"
bannerFile="guppy-banner.png"
logoFile="guppy-banner.png"
logoBlur=true
iconBlur=true

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
